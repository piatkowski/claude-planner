name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sprawdź, czy tag release zgadza się z version w pyproject.toml
        if: github.event_name == 'release'
        run: |
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_NAME="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag release '$TAG_NAME' (wersja '$TAG_VERSION') nie zgadza się z version='$PYPROJECT_VERSION' w pyproject.toml na commicie, na który wskazuje ten tag. Tag prawdopodobnie został utworzony przed zbumpowaniem wersji — przetaguj release na commit z właściwym pyproject.toml zamiast publikować (inaczej zbudujesz paczkę pod złą nazwą wersji)."
            exit 1
          fi
          echo "OK: wersja w pyproject.toml ($PYPROJECT_VERSION) zgadza się z tagiem release ($TAG_NAME)."

      - name: Install build tool
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/claude-planner/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
